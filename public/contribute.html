<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BirthdayWorld — Contribute</title>
  <style>
    :root { color-scheme: dark; --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--mono);
      background: radial-gradient(circle at 50% -10%, #2a3a6a, #10131f 60%);
      color: #f0f2f8;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    .sub { margin: 0 0 18px; color: #aab3cc; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; color: #c5cce0; margin: 20px 0 8px; font-weight: 600; }
    input[type=text] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid #6d8cff; border-color: transparent; }

    .char-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .char-opt {
      width: 60px; padding: 6px 4px 4px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: rgba(0, 0, 0, 0.3); border: 2px solid transparent;
      cursor: pointer; user-select: none;
    }
    .char-opt canvas { width: 36px; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
    .char-opt .cn { font-size: 0.62rem; color: #aab3cc; }
    .char-opt.sel { border-color: #6d8cff; background: rgba(109, 140, 255, 0.25); }
    .char-opt.sel .cn { color: #fff; }
    .char-opt.locked { opacity: 0.35; cursor: not-allowed; }
    .char-opt.locked .cn::after { content: ' ✓'; color: #6d8cff; }

    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-opt {
      border-radius: 12px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .theme-opt.sel { outline: 3px solid #fff; outline-offset: 1px; }

    .line-input { margin-top: 10px; }
    #addLine {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #cdd6f0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #addLine:disabled { opacity: 0.4; cursor: default; }

    button.submit {
      margin-top: 26px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6d8cff, #9b6dff);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit:disabled { opacity: 0.6; cursor: default; }
    .err { color: #ff9b9b; margin-top: 12px; font-size: 0.9rem; min-height: 1em; }
    .done { text-align: center; padding: 30px 10px; display: none; }
    .done.show { display: block; }
    .done .big { font-size: 3rem; }
    .done h2 { margin: 12px 0 6px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Plant your patch</h1>
    <p class="sub" id="sub">Add your character to <span id="personName">the world</span>.</p>

    <form id="form">
      <label>Pick your character</label>
      <div class="char-row" id="charRow"></div>

      <label for="charName">Character name (shown above their head)</label>
      <input id="charName" type="text" placeholder="e.g. Wizard Greg" maxlength="40" />

      <label>Pick a zone theme</label>
      <div class="theme-grid" id="themeGrid"></div>

      <label>Your message (up to 3 lines)</label>
      <div id="linesWrap">
        <input class="line-input" type="text" placeholder="Your message…" maxlength="200" />
      </div>
      <button type="button" id="addLine">+ add another line</button>

      <button class="submit" type="submit" id="submit">Plant my patch</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div class="card done" id="done">
    <h2>Your patch is planted.</h2>
    <p class="sub">Thanks for adding to the world. You can close this page.</p>
  </div>

  <script src="/pixel/characters.js"></script>
  <script>
    const worldId = location.pathname.split('/').pop();

    const THEMES = [
      { id: 'forest', label: 'Forest', color: '#2d4a1e' },
      { id: 'beach', label: 'Beach', color: '#1a6b8a' },
      { id: 'cave', label: 'Cave', color: '#3a2820' },
      { id: 'snow', label: 'Snow', color: '#5b7a88' },
      { id: 'desert', label: 'Desert', color: '#8a7040' },
      { id: 'magical', label: 'Magical', color: '#3a2060' },
    ];

    const NPC_DESIGNS = BW.characters.NPC_DESIGNS;
    let selectedDesign = NPC_DESIGNS[0].id;
    let selectedTheme = THEMES[0].id;

    // Build generated pixel-art character options (locking applied after usage loads)
    const charRow = document.getElementById('charRow');
    const charOptEls = {};
    NPC_DESIGNS.forEach((d) => {
      const div = document.createElement('div');
      div.className = 'char-opt';
      div.dataset.id = d.id;
      const canvas = document.createElement('canvas');
      BW.characters.drawToCanvas(canvas, d, 3);
      const label = document.createElement('span');
      label.className = 'cn';
      label.textContent = d.name;
      div.appendChild(canvas);
      div.appendChild(label);
      div.addEventListener('click', () => {
        if (div.classList.contains('locked')) return;
        selectedDesign = d.id;
        charRow.querySelectorAll('.char-opt').forEach((el) => el.classList.toggle('sel', el === div));
      });
      charRow.appendChild(div);
      charOptEls[d.id] = div;
    });

    function applySpriteLocking(usedSprites) {
      // Count how many times each sprite appears in this world's chunks.
      const counts = {};
      NPC_DESIGNS.forEach((d) => { counts[d.id] = 0; });
      usedSprites.forEach((id) => { if (counts[id] !== undefined) counts[id]++; });

      // A sprite is locked for the current round if its count exceeds the minimum
      // across all sprites. When everyone has been used once the minimum rises and
      // all sprites unlock together for the next round.
      const minCount = Math.min(...Object.values(counts));
      NPC_DESIGNS.forEach((d) => {
        const locked = counts[d.id] > minCount;
        charOptEls[d.id].classList.toggle('locked', locked);
      });

      // Auto-select the first available sprite.
      const firstAvail = NPC_DESIGNS.find((d) => counts[d.id] <= minCount);
      if (firstAvail) {
        selectedDesign = firstAvail.id;
        charRow.querySelectorAll('.char-opt').forEach((el) =>
          el.classList.toggle('sel', el.dataset.id === firstAvail.id));
      }
    }

    // Build theme grid
    const themeGrid = document.getElementById('themeGrid');
    THEMES.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'theme-opt' + (i === 0 ? ' sel' : '');
      div.style.background = t.color;
      div.textContent = t.label;
      div.addEventListener('click', () => {
        selectedTheme = t.id;
        document.querySelectorAll('.theme-opt').forEach((el) => el.classList.remove('sel'));
        div.classList.add('sel');
      });
      themeGrid.appendChild(div);
    });

    // Dialogue lines (up to 3)
    const linesWrap = document.getElementById('linesWrap');
    const addLineBtn = document.getElementById('addLine');
    function refreshAddBtn() {
      addLineBtn.disabled = linesWrap.querySelectorAll('input').length >= 3;
    }
    addLineBtn.addEventListener('click', () => {
      if (linesWrap.querySelectorAll('input').length >= 3) return;
      const inp = document.createElement('input');
      inp.className = 'line-input';
      inp.type = 'text';
      inp.placeholder = 'Another line…';
      inp.maxLength = 200;
      linesWrap.appendChild(inp);
      refreshAddBtn();
    });

    // Load world name + sprite usage in parallel.
    Promise.all([
      fetch(`/worlds/${worldId}`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch(`/worlds/${worldId}/sprite-usage`).then((r) => (r.ok ? r.json() : [])).catch(() => []),
    ]).then(([w, usage]) => {
      if (w && w.birthday_person) {
        document.getElementById('personName').textContent = `${w.birthday_person}'s world`;
      }
      applySpriteLocking(usage);
    });

    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit');
    const errEl = document.getElementById('err');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const lines = Array.from(linesWrap.querySelectorAll('input'))
        .map((i) => i.value.trim())
        .filter((v) => v.length > 0);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Planting…';
      try {
        const res = await fetch(`/worlds/${worldId}/chunks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sprite: selectedDesign,
            theme: selectedTheme,
            contributor_name: document.getElementById('charName').value,
            dialogue_lines: lines,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Something went wrong');
        }
        document.getElementById('card').style.display = 'none';
        document.getElementById('done').classList.add('show');
      } catch (err) {
        errEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Plant my patch';
      }
    });

    refreshAddBtn();
  </script>
</body>
</html>
