<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BirthdayWorld — Contribute</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% -10%, #2a3a6a, #10131f 60%);
      color: #f0f2f8;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    .sub { margin: 0 0 18px; color: #aab3cc; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; color: #c5cce0; margin: 20px 0 8px; font-weight: 600; }
    input[type=text] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid #6d8cff; border-color: transparent; }

    .emoji-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .emoji-opt {
      width: 52px; height: 52px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid transparent;
      cursor: pointer;
      user-select: none;
    }
    .emoji-opt.sel { border-color: #6d8cff; background: rgba(109, 140, 255, 0.25); }

    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-opt {
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .theme-opt .ic { display: block; font-size: 1.5rem; margin-bottom: 4px; }
    .theme-opt.sel { outline: 3px solid #fff; outline-offset: 1px; }

    .line-input { margin-top: 10px; }
    #addLine {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #cdd6f0;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #addLine:disabled { opacity: 0.4; cursor: default; }

    button.submit {
      margin-top: 26px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6d8cff, #9b6dff);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit:disabled { opacity: 0.6; cursor: default; }
    .err { color: #ff9b9b; margin-top: 12px; font-size: 0.9rem; min-height: 1em; }
    .done { text-align: center; padding: 30px 10px; display: none; }
    .done.show { display: block; }
    .done .big { font-size: 3rem; }
    .done h2 { margin: 12px 0 6px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>🌱 Plant your patch</h1>
    <p class="sub" id="sub">Add your character to <span id="personName">the world</span>.</p>

    <form id="form">
      <label>Pick your character</label>
      <div class="emoji-row" id="emojiRow"></div>

      <label for="charName">Character name (shown above their head)</label>
      <input id="charName" type="text" placeholder="e.g. Wizard Greg" maxlength="40" />

      <label>Pick a zone theme</label>
      <div class="theme-grid" id="themeGrid"></div>

      <label for="greeting">Greeting line (shown when they get close)</label>
      <input id="greeting" type="text" placeholder="Hey, I've been looking for you…" maxlength="80" />

      <label>Main message (talk to them — up to 3 lines)</label>
      <div id="linesWrap">
        <input class="line-input" type="text" placeholder="Your message…" maxlength="120" />
      </div>
      <button type="button" id="addLine">+ add another line</button>

      <button class="submit" type="submit" id="submit">Plant my patch</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div class="card done" id="done">
    <div class="big">🌷</div>
    <h2>Your patch is planted.</h2>
    <p class="sub">Thanks for adding to the world. You can close this page.</p>
  </div>

  <script>
    const worldId = location.pathname.split('/').pop();

    const EMOJIS = ['🧙', '🧝', '🧜', '🧚', '🦊', '🐺', '🐸', '🤖'];
    const THEMES = [
      { id: 'forest', label: 'Forest', ic: '🌲', color: '#2d4a1e' },
      { id: 'beach', label: 'Beach', ic: '🏖', color: '#1a6b8a' },
      { id: 'cave', label: 'Cave', ic: '⛰', color: '#3a2820' },
      { id: 'snow', label: 'Snow', ic: '❄', color: '#5b7a88' },
      { id: 'desert', label: 'Desert', ic: '🌵', color: '#8a7040' },
      { id: 'magical', label: 'Magical', ic: '✨', color: '#3a2060' },
    ];

    let selectedEmoji = EMOJIS[0];
    let selectedTheme = THEMES[0].id;

    // Build emoji pickers
    const emojiRow = document.getElementById('emojiRow');
    EMOJIS.forEach((e, i) => {
      const div = document.createElement('div');
      div.className = 'emoji-opt' + (i === 0 ? ' sel' : '');
      div.textContent = e;
      div.addEventListener('click', () => {
        selectedEmoji = e;
        document.querySelectorAll('.emoji-opt').forEach((el) => el.classList.remove('sel'));
        div.classList.add('sel');
      });
      emojiRow.appendChild(div);
    });

    // Build theme grid
    const themeGrid = document.getElementById('themeGrid');
    THEMES.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'theme-opt' + (i === 0 ? ' sel' : '');
      div.style.background = t.color;
      div.innerHTML = `<span class="ic">${t.ic}</span>${t.label}`;
      div.addEventListener('click', () => {
        selectedTheme = t.id;
        document.querySelectorAll('.theme-opt').forEach((el) => el.classList.remove('sel'));
        div.classList.add('sel');
      });
      themeGrid.appendChild(div);
    });

    // Dialogue lines (up to 3)
    const linesWrap = document.getElementById('linesWrap');
    const addLineBtn = document.getElementById('addLine');
    function refreshAddBtn() {
      addLineBtn.disabled = linesWrap.querySelectorAll('input').length >= 3;
    }
    addLineBtn.addEventListener('click', () => {
      if (linesWrap.querySelectorAll('input').length >= 3) return;
      const inp = document.createElement('input');
      inp.className = 'line-input';
      inp.type = 'text';
      inp.placeholder = 'Another line…';
      inp.maxLength = 120;
      linesWrap.appendChild(inp);
      refreshAddBtn();
    });

    // Load world name for a friendlier header
    fetch(`/worlds/${worldId}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((w) => {
        if (w && w.birthday_person) {
          document.getElementById('personName').textContent = `${w.birthday_person}'s world`;
        }
      })
      .catch(() => {});

    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit');
    const errEl = document.getElementById('err');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const lines = Array.from(linesWrap.querySelectorAll('input'))
        .map((i) => i.value.trim())
        .filter((v) => v.length > 0);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Planting…';
      try {
        const res = await fetch(`/worlds/${worldId}/chunks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sprite: selectedEmoji,
            theme: selectedTheme,
            contributor_name: document.getElementById('charName').value,
            greeting: document.getElementById('greeting').value,
            dialogue_lines: lines,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Something went wrong');
        }
        document.getElementById('card').style.display = 'none';
        document.getElementById('done').classList.add('show');
      } catch (err) {
        errEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Plant my patch';
      }
    });

    refreshAddBtn();
  </script>
</body>
</html>
