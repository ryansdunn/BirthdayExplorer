<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BirthdayWorld — Explore</title>
  <style>
    :root {
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #10131f; }
    #game { width: 100vw; height: 100vh; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #cdd6f0; font-family: var(--mono); font-size: 1.05rem; z-index: 10;
      background: #10131f;
    }

    /* ── Pre-birthday countdown screen ──────────────────────────────────── */
    #countdown {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(circle at 50% 35%, #1a2a4a 0%, #10131f 65%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      font-family: var(--mono); color: #f0f2f8; text-align: center; padding: 24px;
    }
    #countdown.show { display: flex; }
    #cdTitle {
      font-size: clamp(0.8rem, 2.5vw, 1rem); color: #6a7494;
      letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px;
    }
    #cdName {
      font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700;
      background: linear-gradient(90deg, #a78bff, #6d8cff, #a78bff);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: hb-shimmer 3s linear infinite;
      line-height: 1.2; margin-bottom: 10px;
    }
    #cdDateLine {
      font-size: 0.8rem; color: #4a5470; margin-bottom: 52px;
      letter-spacing: 0.06em;
    }
    #cdTimer {
      display: flex; gap: clamp(8px, 3vw, 20px); align-items: flex-start;
      justify-content: center;
    }
    .cd-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .cd-num {
      font-size: clamp(2.4rem, 9vw, 5rem); font-weight: 700;
      line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
      color: #eef3ff;
    }
    .cd-lbl {
      font-size: clamp(0.55rem, 1.5vw, 0.65rem); color: #4a5470;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .cd-sep {
      font-size: clamp(1.8rem, 7vw, 3.8rem); font-weight: 300;
      color: #2a3550; line-height: 1; padding-top: 4px;
    }

    /* ── Creator preview-mode badge ──────────────────────────────────────── */
    #previewBadge {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 60; display: none;
    }
    #previewBadge.show { display: block; }
    #previewToggleBtn {
      background: rgba(10, 12, 24, 0.88);
      border: 1px solid rgba(109, 140, 255, 0.45); color: #9fb0ff;
      font-family: var(--mono); font-size: 0.72rem; padding: 6px 16px;
      border-radius: 20px; cursor: pointer; white-space: nowrap;
      backdrop-filter: blur(6px);
    }
    #previewToggleBtn:hover { border-color: #6d8cff; color: #fff; }

    /* ── Living portrait card (roster of people met) ─────────────────────── */
    #portrait {
      position: fixed; top: 16px; left: 16px; z-index: 20; display: none;
      width: 300px; max-width: calc(100vw - 32px);
      font-family: var(--mono); color: #eef3ff;
      background: rgba(12, 16, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px; padding: 14px 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }
    #pHappyBday {
      font-size: 1.15rem; font-weight: 700; letter-spacing: 0.04em;
      background: linear-gradient(90deg, #a78bff, #6d8cff, #a78bff);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: hb-shimmer 3s linear infinite;
      text-shadow: none;
      line-height: 1.3; padding-bottom: 2px;
    }
    @keyframes hb-shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    #pProgress { margin-top: 12px; font-size: 0.74rem; color: #aab3cc; letter-spacing: 0.03em; }
    .p-track { margin-top: 5px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
    #pBar { height: 100%; width: 0%; background: linear-gradient(90deg, #6d8cff, #9b6dff); transition: width 0.4s ease; }
    #pHint { margin-top: 12px; font-size: 0.74rem; line-height: 1.45; color: #c5cce0; }
    #pList { list-style: none; margin: 10px 0 0; padding: 0; max-height: 38vh; overflow-y: auto; }
    .p-row {
      display: flex; align-items: center; gap: 9px; padding: 6px 6px;
      border-radius: 8px; cursor: default;
    }
    .p-row:hover { background: rgba(255, 255, 255, 0.07); }
    .p-av {
      width: 22px; height: auto; flex: none; image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .p-nm { font-size: 0.82rem; font-weight: 600; }
    /* hover tooltip showing the message a person wrote */
    #pTip {
      position: fixed; display: none; z-index: 30; max-width: 280px;
      font-family: var(--mono); font-size: 0.76rem; line-height: 1.5; white-space: pre-wrap;
      color: #fff8d0; background: rgba(20, 16, 8, 0.95);
      border: 1px solid rgba(255, 226, 122, 0.35); border-radius: 10px;
      padding: 9px 12px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5); pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="loading">Loading the world…</div>
  <div id="game"></div>

  <!-- Pre-birthday countdown (shown when birthday_date is in the future) -->
  <div id="countdown">
    <div id="cdTitle">a birthday world is waiting</div>
    <div id="cdName"></div>
    <div id="cdDateLine"></div>
    <div id="cdTimer">
      <div class="cd-unit"><span class="cd-num" id="cdDays">00</span><span class="cd-lbl">days</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cdHours">00</span><span class="cd-lbl">hours</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cdMins">00</span><span class="cd-lbl">min</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cdSecs">00</span><span class="cd-lbl">sec</span></div>
    </div>
  </div>

  <!-- Creator preview toggle (shown only when ?preview=true) -->
  <div id="previewBadge">
    <button id="previewToggleBtn">Switch to countdown view</button>
  </div>

  <div id="portrait" aria-label="Living portrait">
    <div id="pHappyBday">Happy Birthday</div>
    <div id="pProgress">0/0 discovered</div>
    <div class="p-track"><div id="pBar"></div></div>
    <p id="pHint">Walk up to someone and press SPACE to talk.</p>
    <ul id="pList"></ul>
  </div>
  <div id="pTip"></div>

  <script src="/pixel/noise.js"></script>
  <script src="/pixel/palettes.js"></script>
  <script src="/pixel/characters.js"></script>
  <script src="/pixel/sprites.js"></script>
  <script src="/pixel/textures.js"></script>
  <script src="/pixel/terrain.js"></script>
  <script src="/pixel/weapon.js"></script>
  <script src="/explore.js"></script>
</body>
</html>
